# Builds and tests every push to main and every pull request, as strictly as a local build with CI=true:
# warnings are errors. The Release build packs the Engine into the .vsix, which is kept as an artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: VisualStudioTranslator.vsix
          path: src/VisualStudioTranslator.Vsix/bin/Release/net48/*.vsix
          if-no-files-found: error